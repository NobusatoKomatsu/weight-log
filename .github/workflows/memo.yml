name: Screen Memo APK

on:
  push:
    paths: ["memo-android/**", ".github/workflows/memo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p memo-android testReleaseUnitTest assembleRelease bundleRelease --no-daemon
          cp memo-android/app/build/outputs/apk/release/app-release.apk screen-memo.apk
          # Google Play に提出するのは AAB
          cp memo-android/app/build/outputs/bundle/release/app-release.aab screen-memo.aab

      # main 以外のブランチでは、試せるように Actions の成果物として残す
      - uses: actions/upload-artifact@v4
        with:
          name: screen-memo-apk
          path: |
            screen-memo.apk
            screen-memo.aab

      - name: Publish to release "memo"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view memo >/dev/null 2>&1 || gh release create memo \
            --title "画面メモ Androidアプリ" \
            --notes "screen-memo.apk をダウンロードしてインストールしてください。"
          gh release upload memo screen-memo.apk screen-memo.aab --clobber
          gh release edit memo --notes "screen-memo.apk をダウンロードしてインストールしてください。Google Play には screen-memo.aab を提出します。（ビルド ${{ github.run_number }}）"
