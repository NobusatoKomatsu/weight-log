name: みんなの声 を Cloudflare に公開

# main に vote-site の変更が入ったとき、または Actions 画面から手動で実行したときに公開する
on:
  push:
    branches: [main]
    paths: ["vote-site/**", ".github/workflows/vote-site.yml"]
  workflow_dispatch:

concurrency: vote-site-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vote-site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_VERIFY_SID: ${{ secrets.TWILIO_VERIFY_SID }}
      ADMIN_TOKEN: ${{ secrets.VOTE_ADMIN_TOKEN }}
      PHONE_PEPPER: ${{ secrets.VOTE_PHONE_PEPPER }}
      WRANGLER: npx --yes wrangler@4.156.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要な Secrets がそろっているか確認
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN ADMIN_TOKEN PHONE_PEPPER; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets が足りません:$missing（ADMIN_TOKEN は VOTE_ADMIN_TOKEN、PHONE_PEPPER は VOTE_PHONE_PEPPER という名前で登録）"
            exit 1
          fi

      - name: Twilio Verify サービスを用意（TWILIO_VERIFY_SID が無ければ「みんなの声」を探す／作る）
        run: |
          if [ -z "$TWILIO_VERIFY_SID" ]; then
            auth="$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN"
            sid=$(curl -fsS -u "$auth" "https://verify.twilio.com/v2/Services?PageSize=50" \
              | jq -r '.services[] | select(.friendly_name == "みんなの声") | .sid' | head -1)
            if [ -z "$sid" ]; then
              sid=$(curl -fsS -u "$auth" -X POST "https://verify.twilio.com/v2/Services" \
                --data-urlencode "FriendlyName=みんなの声" --data-urlencode "CodeLength=6" | jq -r '.sid')
              echo "Twilio Verify サービスを作りました: $sid"
            fi
            [ -n "$sid" ] && [ "$sid" != "null" ] || { echo "::error::Twilio Verify サービスを用意できませんでした（SID / Auth Token を確認）"; exit 1; }
            echo "TWILIO_VERIFY_SID=$sid" >> "$GITHUB_ENV"
          fi

      - name: D1 データベースを用意して wrangler.jsonc に ID を書き込む
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "minnano-koe") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create minnano-koe
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "minnano-koe") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::D1 データベースを用意できませんでした"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: テーブルを作る（すでにあれば何もしない）
        run: $WRANGLER d1 execute minnano-koe --remote --file=schema.sql

      - name: 公開
        run: $WRANGLER deploy

      - name: 秘密の値を Worker に登録
        run: |
          jq -n --arg a "$ADMIN_TOKEN" --arg p "$PHONE_PEPPER" --arg s "$TWILIO_ACCOUNT_SID" \
                --arg t "$TWILIO_AUTH_TOKEN" --arg v "$TWILIO_VERIFY_SID" \
                '{ADMIN_TOKEN:$a, PHONE_PEPPER:$p, TWILIO_ACCOUNT_SID:$s, TWILIO_AUTH_TOKEN:$t, TWILIO_VERIFY_SID:$v}' > "$RUNNER_TEMP/secrets.json"
          $WRANGLER secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
