name: Stones data

on:
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wikidata から石データを取得
        run: node stones/build-data.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stones/data/stones.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "石データを更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
