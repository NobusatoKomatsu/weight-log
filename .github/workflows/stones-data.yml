name: Stones data

# 世界の石 図鑑（stones/）のデータを Wikidata から取り直して、変わっていればコミットする。
on:
  schedule:
    - cron: "23 3 1 * *" # 毎月 1 日 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stones-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wikidata から石のデータを取得
        run: node stones/tools/build-data.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stones/data/stones.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "石図鑑のデータを更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
