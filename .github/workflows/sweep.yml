name: App Sweep APK

on:
  push:
    paths: ["sweep-android/**", ".github/workflows/sweep.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p sweep-android testReleaseUnitTest assembleRelease bundleRelease --no-daemon
          cp sweep-android/app/build/outputs/apk/release/app-release.apk app-sweep.apk
          # Google Play に提出するのは AAB
          cp sweep-android/app/build/outputs/bundle/release/app-release.aab app-sweep.aab

      # main 以外のブランチでは、試せるように Actions の成果物として残す
      - uses: actions/upload-artifact@v4
        with:
          name: app-sweep-apk
          path: |
            app-sweep.apk
            app-sweep.aab

      - name: Publish to release "sweep"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sweep >/dev/null 2>&1 || gh release create sweep \
            --title "アプリ一掃 Androidアプリ" \
            --notes "app-sweep.apk をダウンロードしてインストールしてください。"
          gh release upload sweep app-sweep.apk app-sweep.aab --clobber
          gh release edit sweep --notes "app-sweep.apk をダウンロードしてインストールしてください。Google Play には app-sweep.aab を提出します。（ビルド ${{ github.run_number }}）"
