name: App Check APK

on:
  push:
    paths: ["organize-android/**", ".github/workflows/organize.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p organize-android testReleaseUnitTest assembleRelease bundleRelease --no-daemon
          cp organize-android/app/build/outputs/apk/release/app-release.apk app-check.apk
          # Google Play に提出するのは AAB
          cp organize-android/app/build/outputs/bundle/release/app-release.aab app-check.aab

      # main 以外のブランチでは、試せるように Actions の成果物として残す
      - uses: actions/upload-artifact@v4
        with:
          name: app-check-apk
          path: |
            app-check.apk
            app-check.aab

      - name: Publish to release "check"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view check >/dev/null 2>&1 || gh release create check \
            --title "Androidアプリ整理アプリ" \
            --notes "app-check.apk をダウンロードしてインストールしてください。"
          gh release upload check app-check.apk app-check.aab --clobber
          gh release edit check --notes "app-check.apk をダウンロードしてインストールしてください。Google Play には app-check.aab を提出します。（ビルド ${{ github.run_number }}）"
